name: Build & Deploy

# Builds the app, runs the tests and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Hinweis, falls Pages nicht aktiviert ist
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages ist nicht aktiviert. Settings → Pages → Source: 'GitHub Actions' (bei privaten Repos ist dafür GitHub Pro nötig). Build und Tests waren erfolgreich."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
